schema_version: 1
phase: 0
name: "Existing-Chrome feasibility bootstrap"
owner: "Japneet Kalkat"

toolchain:
  rust:
    floor: "1.85.0"
    pinned: "rust-toolchain.toml"
  node:
    floor: "20.0.0"
  npm:
    floor: "10.0.0"
  chrome:
    floor: "125"
    ceiling: "record-at-run"

artifact_policy:
  root: "artifacts/"
  write_mode: "redacted-only"
  network: "forbidden"
  required_fields:
    [
      "schema_version",
      "build_tuple",
      "environment",
      "timestamp",
      "command",
      "result",
      "redaction_status",
    ]
  redaction_keys:
    [
      "token",
      "secret",
      "password",
      "cookie",
      "authorization",
      "raw_id",
      "cdp_id",
      "target_id",
      "session_id",
    ]
  ignored_globs: ["artifacts/*", "!artifacts/.gitkeep"]

commands:
  - id: "python-compile"
    status: "required"
    layer: "tooling"
    environment: ["local"]
    fixture: "none"
    owner: "Japneet Kalkat"
    quarantine: false
    command:
      [
        "python3",
        "-m",
        "py_compile",
        "scripts/check_exec_plan.py",
        "scripts/check_test_manifest.py",
        "tests/harness/deterministic.py",
        "tests/harness/test_deterministic.py",
        "tests/replay/replay.py",
      ]
    cwd: "."
    timeout_seconds: 30
    prerequisites: []
    artifacts: []
    result:
      success_exit_codes: [0]
      failure_is_error: true
      stdout: "console"
      stderr: "console"
