<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">agentyc browser control</title>
  <desc id="desc">A monochrome browser window with a precision automation cursor</desc>

  <!-- A quiet, high-contrast field keeps the mark legible in every toolbar context. -->
  <rect width="128" height="128" rx="28" fill="#111111" />

  <!-- The browser frame is one precise white silhouette, not a collection of competing strokes. -->
  <rect x="18" y="17" width="92" height="94" rx="20" fill="#FFFFFF" />
  <path d="M28 47h72v44a10 10 0 0 1-10 10H38a10 10 0 0 1-10-10Z" fill="#111111" />

  <!-- Three compact controls establish the browser at a glance without adding noise. -->
  <circle cx="41" cy="37" r="4" fill="#111111" />
  <circle cx="53" cy="37" r="4" fill="#111111" />
  <circle cx="65" cy="37" r="4" fill="#111111" />

  <!-- The cursor is custom-drawn to hold its shape at 16px. -->
  <path d="m48 56 38 26-15 2-7 15-7-3 7-15-16-1Z" fill="#FFFFFF" />
</svg>
