name: Feature Request
description: Suggest an improvement for the agentyc MCP browser runtime
title: "Feature request: ..."
type: 'Enhancement'
labels: ['enhancement']
body:
  - type: textarea
    id: current_problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the browser automation problem, the site or workflow involved, and the current limitation.
        Include screenshots, HTML snippets, or example URLs when they help reproduce the request.
      placeholder: |
        Example: I need a reliable way to detect which tab opened a download flow after clicking a result row in a SPA.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: What behavior do you want instead?
      description: |
        Describe the concrete tool behavior, API shape, or runtime capability you want agentyc to expose.
      placeholder: |
        Example: Add a tool result field that reports the newly opened tab_id after click-driven navigation.
    validations:
      required: true

  - type: textarea
    id: workarounds
    attributes:
      label: What workarounds have you tried?
      description: |
        List any current workaround, custom script, prompt strategy, or manual step you are using.
      placeholder: |
        Example: I currently poll browser_list_tabs after every click and diff the results.
    validations:
      required: false

  - type: textarea
    id: runtime_context
    attributes:
      label: Runtime context
      description: |
        Share any context that affects the request.
        Useful examples: MCP client, local vs shared browser, headless vs headful, target site type, or auth flow details.
      placeholder: |
        MCP client: Claude Desktop
        Browser mode: local Chrome
        Runtime: headful
        Site type: React SPA behind SSO
    validations:
      required: false

  - type: input
    id: affected_tools
    attributes:
      label: Which tool or API surface is involved?
      description: |
        List the MCP tool names or CLI flags affected, if known.
      placeholder: "Example: browser_click, browser_list_tabs"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: What version of agentyc are you using?
      description: |
        Run `uv pip show agentyc` or `git log -n 1` and share the exact version or git hash.
      placeholder: "Example: 0.1.0 or 62760baaefd"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Before opening a feature request, verify the issue still reproduces on the latest repository state or latest published package.

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: This is blocking my current browser automation workflow
          required: false
        - label: This would materially improve reliability or determinism
          required: false
        - label: This is primarily a usability improvement
          required: false
        - label: I am willing to help implement or test this change
          required: false
