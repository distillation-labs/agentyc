name: 👾 Bug Report
description: Report a bug in the agentyc MCP server
labels: ["bug", "triage"]
title: "Bug: ..."
body:
  - type: input
    id: version
    attributes:
      label: Agentyc Version
      description: |
        What exact version of `agentyc` are you using? (Run `agentyc --version` or `git log -n 1`)
        **DO NOT WRITE `latest release` or `main` or a very old version or we will close your issue!**
      placeholder: "e.g. 0.4.0 or 62760baaefd"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description, Steps to Reproduce, Screenshots
      description: A clear and concise description of what the bug is + steps taken, drag screenshots in showing any error messages and relevant pages.
      placeholder: |
        1. Downloaded the agentyc binary for my platform (or built with `cargo build --release -p agentyc`)
        2. Started the server: `agentyc mcp`
        3. Ran the following MCP/browser call sequence: `navigate to example.com and click xyz`
        4. The runtime failed and showed the following error: ...
    validations:
      required: true

  - type: textarea
    id: calls
    attributes:
      label: Failing MCP Tool Sequence
      description: Include the exact JSON-RPC tool calls that reproduced the issue, redact any sensitive URLs and keys.
      render: json
      placeholder: |
        {"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"browser_navigate","arguments":{"url":"https://example.com"}}}
        {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"browser_get_state","arguments":{"mode":"min"}}}
        {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"browser_click","arguments":{"ref":"e42"}}}

  - type: input
    id: client
    attributes:
      label: MCP Client
      description: Which MCP client / coding agent are you using? (Optional)
      placeholder: "e.g. Claude Code, Cursor, custom stdio client"

  - type: input
    id: os
    attributes:
      label: Operating System & Browser Versions
      description: What operating system and browser are you using? (Optional)
      placeholder: "e.g. Ubuntu 24.04 + Chrome v136, Windows 11 + Chrome v133, macOS + Chrome ..."

  - type: textarea
    id: logs
    attributes:
      label: Full DEBUG Log Output
      description: Please copy and paste the log output. Make sure to set `AGENTYC_LOGGING_LEVEL=debug` in your `.env` or shell environment.
      render: shell
      placeholder: |
        $ AGENTYC_LOGGING_LEVEL=debug agentyc mcp
        DEBUG    [browser] Initializing new browser
        DEBUG    [mcp] session initialized
