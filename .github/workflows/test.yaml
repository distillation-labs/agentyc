name: test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - stable
      - "releases/**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  AGENTYC_HEADLESS: "1"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Provide a real Chrome for the browser-automation integration tests.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Build the binary the integration tests spawn over stdio.
      - run: cargo build -p agentyc --locked

      - name: Check Phase 5 manifest and offline evidence contract
        run: |
          python3 scripts/check_phase_5.py
          python3 scripts/check_p5_performance.py --mode offline --artifact-dir artifacts/p5-performance-smoke-final
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_check_phase_5 scripts.test_p5_performance

      - name: Check extension production paths
        run: |
          npm ci --prefix extension
          npm test --prefix extension
          npm run check --prefix extension

      # Default run skips #[ignore] tests (live network + headed/display).
      - name: Run tests
        run: cargo test --workspace --locked -- --test-threads=4
