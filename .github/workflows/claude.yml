name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
      discussions: write
      issues: write
    env:
      IS_SANDBOX: "1"
      CARGO_TERM_COLOR: always
      AGENTYC_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Real Chrome for the browser-automation integration tests.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - run: cargo build --workspace --locked

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-opus-4-20250514"
          fallback_model: "claude-3-5-sonnet-20241022"
          custom_instructions: |
            this is a Rust workspace (cargo). when making any significant changes, start by adding one or two new failing #[test] functions to the most relevant file in tests/*.rs, then work on your changes until `cargo test` passes.
            make sure formatting and lints pass before committing: `cargo fmt --all` and `cargo clippy --workspace --all-targets -- -D warnings`. you can also use mcp tools to check GitHub CI status.
            run `cargo test --workspace` at the end to make sure no other tests started failing due to your changes. browser tests need Chrome; #[ignore] tests require network or a display and are run with `-- --ignored`.
            if any significant features were added or removed, or any public-facing tool parameters/signatures changed, look through docs/*.md and the bundled SKILL.md and fix any relevant areas.
          branch_prefix: "claude-"
          additional_permissions: |
            actions: read
          claude_env: |
            AGENTYC_HEADLESS: '1'
            ANONYMIZED_TELEMETRY: 'false'
            AGENTYC_LOGGING_LEVEL: 'debug'
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(git:*)",
                  "Bash(cargo:*)",
                  "Bash(rustup:*)",
                  "Bash(rustfmt:*)",
                  "Bash(sed:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)",
                  "Bash(find:*)",
                  "Bash(grep:*)",
                  "Bash(chmod:*)",
                  "Bash(rm:*)",
                  "WebFetch(*)",
                  "WebSearch(*)"
                ],
                "additionalDirectories": ["/home/runner/work"]
              }
            }
          allowed_tools: |
            Bash(git:*)
            Bash(cargo:*)
            Bash(rustup:*)
            Bash(rustfmt:*)
            Bash(sed:*)
            Bash(rg:*)
            Bash(jq:*)
            Bash(find:*)
            Bash(grep:*)
            Bash(chmod:*)
            Bash(rm:*)
            WebFetch(*)
            WebSearch(*)
