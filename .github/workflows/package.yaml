name: package

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - stable
      - "releases/**"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p agentyc --locked

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/agentyc --help > /dev/null

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/agentyc.exe --help > $null

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentyc-${{ matrix.os }}
          path: |
            target/release/agentyc
            target/release/agentyc.exe
          if-no-files-found: ignore
