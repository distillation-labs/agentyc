name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  AGENTYC_HEADLESS: '1'

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p agentyc --locked
      - run: cargo test --workspace --release --locked -- --test-threads=4

  direct-release-gate:
    name: direct-release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run rollout unit checks
        run: python3 -m unittest discover -s tests/rollout -p 'test_*.py'
      - name: Run fail-closed direct release gate
        run: python3 scripts/run_release_gate.py --require-live --artifact-dir artifacts/p7-release-gate
      - name: Upload direct gate artifacts after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p7-release-gate-${{ github.run_id }}
          path: artifacts/p7-release-gate
          if-no-files-found: ignore

  publish-binaries:
    name: publish-${{ matrix.target }}
    needs: [release-gate, direct-release-gate]
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p agentyc --target ${{ matrix.target }} --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -C target/${{ matrix.target }}/release -czf agentyc-${{ matrix.target }}.tar.gz agentyc

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/agentyc.exe -DestinationPath agentyc-${{ matrix.target }}.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agentyc-${{ matrix.target }}.tar.gz
            agentyc-${{ matrix.target }}.zip
