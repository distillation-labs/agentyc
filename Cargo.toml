[workspace]
members = [
    "crates/agentyc-cdp",
    "crates/agentyc-browser",
    "crates/agentyc-tools",
    "crates/agentyc-mcp",
    "crates/agentyc",
    "crates/agentyc-tests",
]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["Japneet Kalkat"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
chromiumoxide_cdp = "0.9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
scraper = "0.23"
htmd = "0.2"
sysinfo = "0.35"
mimalloc = { version = "0.1", default-features = false }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"
base64 = "0.22"
tempfile = "3"
dirs = "5"
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
glob = "0.3"
md5 = "0.7"
schemars = "1.0"
axum = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
