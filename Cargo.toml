[workspace]
members = [
    "crates/agentyc-core",
    "crates/agentyc-host",
    "crates/agentyc-mcp",
    "crates/agentyc",
    "crates/agentyc-tests",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
authors = ["Japneet Kalkat"]
license = "MIT"
repository = "https://github.com/distillation-labs/agentyc"
homepage = "https://github.com/distillation-labs/agentyc"
readme = "README.md"
keywords = ["mcp", "browser", "automation", "cdp", "agent"]
categories = ["development-tools", "web-programming", "command-line-utilities"]

[workspace.dependencies]
# Internal crates — dual path+version for crates.io publishing.
agentyc-core    = { version = "2.0.0", path = "crates/agentyc-core" }
agentyc-host    = { version = "2.0.0", path = "crates/agentyc-host" }
agentyc-mcp     = { version = "2.0.0", path = "crates/agentyc-mcp" }
# External dependencies
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sysinfo = "0.35"
mimalloc = { version = "0.1", default-features = false }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3"
dirs = "5"
async-trait = "0.1"
tokio-stream = "0.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

md5 = "0.7"
schemars = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
