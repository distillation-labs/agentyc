version: 1
skill: pydantic-v2-engineer
suites:
  - name: triggering
    objective: Load for repo-specific Pydantic v2 model design and validation questions.
    pass_thresholds:
      relevant_trigger_rate: ">=90%"
      unrelated_non_trigger_rate: "100%"
    cases:
      - id: trig-01
        prompt: How should this agentyc model use ConfigDict and validators?
        expect_trigger: true
      - id: trig-02
        prompt: Should this runtime cache be a PrivateAttr or a Field?
        expect_trigger: true
      - id: trig-03
        prompt: How do we split these Pydantic views from service logic?
        expect_trigger: true
      - id: nontrig-01
        prompt: How do we structure async startup and cancellation?
        expect_trigger: false
      - id: nontrig-02
        prompt: Which MCP primitive should this feature use?
        expect_trigger: false
  - name: functional
    objective: Recommend explicit model contracts and repo conventions.
    cases:
      - id: func-01
        prompt: Model a service object that holds EventBus and mutable cache state.
        success_criteria:
          - Uses ConfigDict with arbitrary_types_allowed where needed.
          - Recommends PrivateAttr for mutable runtime cache.
          - Avoids validate_assignment pitfalls on service models.
      - id: func-02
        prompt: Add field-level and cross-field validation to this request model.
        success_criteria:
          - Prefers AfterValidator for field-level constraints.
          - Uses model_validator for cross-field rules.
          - Keeps models in views.py and logic in service.py.
  - name: performance-and-robustness
    objective: Reduce schema drift and accidental permissiveness.
    baseline_without_skill:
      symptoms:
        - Implicit ConfigDict defaults.
        - Optional, List, and Dict legacy typing.
        - Service logic mixed into BaseModel classes.
    expectations_with_skill:
      - Model contracts are explicit.
      - Runtime-only state stays out of serialization.
      - Shared validators and aliases are reusable, not duplicated.
