version: 1
skill: cdp-browser-engineer
suites:
  - name: triggering
    objective: Load for CDP command selection, BrowserSession wiring, watchdog design, and DOM extraction.
    pass_thresholds:
      relevant_trigger_rate: ">=90%"
      unrelated_non_trigger_rate: "100%"
    cases:
      - id: trig-01
        prompt: Which cdp-use call should we use to attach to a target and store the session id?
        expect_trigger: true
      - id: trig-02
        prompt: Add a watchdog that listens for navigation events and emits a derived event.
        expect_trigger: true
      - id: trig-03
        prompt: How should DomService capture the AX tree for the active target?
        expect_trigger: true
      - id: nontrig-01
        prompt: How do I write a pytest-httpserver fixture for a browser test?
        expect_trigger: false
      - id: nontrig-02
        prompt: How should this MCP tool return structured output?
        expect_trigger: false
  - name: functional
    objective: Keep browser guidance protocol-accurate and session-scoped.
    cases:
      - id: func-01
        prompt: Enable Fetch interception for a target-scoped session and register the right callbacks.
        success_criteria:
          - Uses cdp_client.register for events.
          - Enables Fetch with explicit session_id scoping.
          - Distinguishes continue, fulfill, and fail flows.
      - id: func-02
        prompt: Add a new watchdog that reacts to NavigationCompleteEvent.
        success_criteria:
          - Extends BaseWatchdog.
          - Declares LISTENS_TO and EMITS.
          - Uses on_EventTypeName naming.
  - name: performance-and-robustness
    objective: Avoid brittle browser advice that causes session or event-handler regressions.
    baseline_without_skill:
      symptoms:
        - Wrong or missing session_id scope.
        - Direct cdp_client.on usage.
        - Shared watchdog state mutated ad hoc.
    expectations_with_skill:
      - Session ownership stays in BrowserSession.
      - DOM access routes through DomService.
      - Event handlers are registered once and cleaned up predictably.
