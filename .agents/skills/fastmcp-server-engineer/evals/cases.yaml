version: 1
skill: fastmcp-server-engineer
suites:
  - name: triggering
    objective: Load for FastMCP implementation, protocol surface design, and server runtime questions.
    pass_thresholds:
      relevant_trigger_rate: ">=90%"
      unrelated_non_trigger_rate: "100%"
    cases:
      - id: trig-01
        prompt: Should this MCP feature be a tool, resource, or prompt in FastMCP?
        expect_trigger: true
      - id: trig-02
        prompt: How do we add request-scoped context and middleware to this FastMCP server?
        expect_trigger: true
      - id: trig-03
        prompt: We need Streamable HTTP for this FastMCP server. What should the surface and transport look like?
        expect_trigger: true
      - id: nontrig-01
        prompt: How should I model this Pydantic validator?
        expect_trigger: false
      - id: nontrig-02
        prompt: Which CDP event should handle download start?
        expect_trigger: false
  - name: functional
    objective: Map protocol design cleanly onto FastMCP implementation details.
    cases:
      - id: func-01
        prompt: Design a dynamic catalog in FastMCP where tools can appear or disappear at runtime.
        success_criteria:
          - Chooses the right primitive or provider shape.
          - Includes list-changed notifications.
          - Addresses visibility and discovery semantics.
      - id: func-02
        prompt: Implement a typed FastMCP tool that returns both human-readable content and structured output.
        success_criteria:
          - Uses typed signatures and docstrings.
          - Chooses plain return vs ToolResult intentionally.
          - Covers validation, context, and runtime settings.
  - name: performance-and-robustness
    objective: Avoid protocol drift and oversized server modules.
    baseline_without_skill:
      symptoms:
        - Everything modeled as tools.
        - Transport chosen by preference rather than deployment reality.
        - server.py absorbs all business logic.
    expectations_with_skill:
      - Primitive boundaries are explicit and defensible.
      - Middleware and shared helpers own cross-cutting concerns.
      - Output shapes are intentional for both humans and clients.
