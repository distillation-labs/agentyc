version: 1
skill: breakthrough-autoresearch
suites:
  - name: triggering
    objective: Load for deep research, ranked-hypothesis work, and ruthless benchmark-driven iteration.
    pass_thresholds:
      relevant_trigger_rate: ">=90%"
      unrelated_non_trigger_rate: "100%"
    cases:
      - id: trig-01
        prompt: Research deeply why browser action success dropped and rank the highest-ROI experiments.
        expect_trigger: true
      - id: trig-02
        prompt: Run an autoresearch loop on this metric until we hit 95% or prove the bottleneck is elsewhere.
        expect_trigger: true
      - id: trig-03
        prompt: Compare how leading agent systems handle long-horizon reliability and test what transfers here.
        expect_trigger: true
      - id: nontrig-01
        prompt: Harden this promising direction with rollout guardrails and rollback criteria.
        expect_trigger: false
      - id: nontrig-02
        prompt: Update the changelog and README for the latest release.
        expect_trigger: false
      - id: nontrig-03
        prompt: Fix this typo in one Rust file.
        expect_trigger: false
  - name: functional
    objective: Produce a research-backed experiment loop with explicit keep/discard discipline.
    cases:
      - id: func-01
        prompt: >
          Our DOM extraction quality regressed. We need the likely causes, a ranked backlog of
          experiments, and the cheapest discriminating test to run first.
        success_criteria:
          - Separates facts, inferences, and hypotheses.
          - Produces a ranked backlog.
          - Proposes at least one falsifiable experiment with measurable success criteria.
      - id: func-02
        prompt: >
          Keep improving the browser action-success benchmark until we hit 95% or prove the current
          architecture is not the bottleneck.
        success_criteria:
          - Uses one-variable experiments.
          - Requires keep/discard decisions against the noise floor.
          - Defines a stop condition or handoff point.
  - name: performance-and-robustness
    objective: Beat the no-skill baseline on wasted experiments and vague research output.
    baseline_without_skill:
      symptoms:
        - Jumps from idea to idea without a ranked backlog.
        - Treats one plausible run as enough.
        - Produces interesting observations without measurable next steps.
    expectations_with_skill:
      - Baseline is established before optimization.
      - The next experiment is cheaper and more discriminating than a broad rewrite.
      - The loop stops for a named reason instead of drifting.
