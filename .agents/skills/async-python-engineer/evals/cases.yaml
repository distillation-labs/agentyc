version: 1
skill: async-python-engineer
suites:
  - name: triggering
    objective: Load for asyncio lifecycle, concurrency, and EventBus questions.
    pass_thresholds:
      relevant_trigger_rate: ">=90%"
      unrelated_non_trigger_rate: "100%"
    cases:
      - id: trig-01
        prompt: How should we supervise these background asyncio tasks so errors do not disappear?
        expect_trigger: true
      - id: trig-02
        prompt: How do we wire a bubus event subscriber and cleanly cancel tasks on shutdown?
        expect_trigger: true
      - id: trig-03
        prompt: Should this fan-out use TaskGroup, gather, or a Queue?
        expect_trigger: true
      - id: nontrig-01
        prompt: Which CDP method should I call to enable Fetch interception?
        expect_trigger: false
      - id: nontrig-02
        prompt: How should I model this Pydantic ConfigDict?
        expect_trigger: false
  - name: functional
    objective: Recommend agentyc-specific async patterns with explicit failure handling.
    cases:
      - id: func-01
        prompt: A watchdog starts a polling task with raw asyncio.create_task and exceptions vanish. Fix the pattern.
        success_criteria:
          - Recommends create_task_with_error_handling.
          - Addresses logger or error-event propagation.
          - Flags silent task failures as the main risk.
      - id: func-02
        prompt: We need startup and shutdown ordering for BrowserSession, watchdogs, and the event bus.
        success_criteria:
          - Connects CDP before watchdog startup.
          - Emits stop events before task cancellation.
          - Propagates CancelledError correctly.
  - name: performance-and-robustness
    objective: Reduce silent async failures and lifecycle bugs versus ad hoc asyncio advice.
    baseline_without_skill:
      symptoms:
        - Raw create_task usage.
        - Sleep-based polling for synchronization.
        - Incomplete cleanup on shutdown.
    expectations_with_skill:
      - No silent fire-and-forget exceptions.
      - Bounded waits use timeout-aware primitives.
      - Shared state access is explicit and concurrency-safe.
