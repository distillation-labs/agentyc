version: 1
skill: agentyc-browser-automation
suites:
  - name: triggering
    objective: Load for Agentyc MCP browser automation, tool-choice, and shared-browser workflows.
    pass_thresholds:
      relevant_trigger_rate: ">=90%"
      unrelated_non_trigger_rate: "100%"
    cases:
      - id: trig-01
        prompt: Which Agentyc browser tool should I use to wait for one specific POST response after clicking Save?
        expect_trigger: true
      - id: trig-02
        prompt: I want two coding agents in different projects to reuse the same Agentyc browser and keep auth. What is the right setup?
        expect_trigger: true
      - id: trig-03
        prompt: Use Agentyc to upload a PDF, submit the form, and confirm the success banner without sleeping blindly.
        expect_trigger: true
      - id: nontrig-01
        prompt: Add a new CDP watchdog class to BrowserSession and wire its events correctly.
        expect_trigger: false
      - id: nontrig-02
        prompt: Design a Postgres schema for a billing service and explain normalization tradeoffs.
        expect_trigger: false
  - name: functional
    objective: Teach coding agents the real Agentyc tool surface with deterministic tool choice.
    cases:
      - id: func-01
        prompt: A user needs to inspect an iframe-backed settings page, change one localStorage key, and verify a success toast.
        success_criteria:
          - Uses `browser_list_frames` and `browser_get_frame_html` or a justified state read before guessing iframe ownership.
          - Uses the dedicated storage tools instead of defaulting to `browser_evaluate`.
          - Uses an explicit verification step such as `browser_wait_for_element` or `since_hash`.
      - id: func-02
        prompt: A checkout button appears to do nothing. Explain the correct Agentyc debugging sequence and which tools to use first.
        success_criteria:
          - Prioritizes console and network inspection before retries.
          - Uses `browser_wait_for_request` or `browser_wait_for_response` for the targeted API path.
          - Reaches `browser_export_debug_bundle` only as a bundled evidence step, not the first move.
      - id: func-03
        prompt: Another coding agent already opened the browser in a different project. Explain how to reuse it today and what limitation still exists.
        success_criteria:
          - Mentions `agentyc browser --detach`, `agentyc mcp --reuse-local-browser`, or `--cdp-url`.
          - States that runtimes reuse the same browser process/profile.
          - States that runtimes should not intentionally co-own the same tab.
  - name: performance-and-robustness
    objective: Reduce tool thrash, brittle selectors, and incorrect shared-browser advice.
    baseline_without_skill:
      symptoms:
        - Agents jump to screenshots or `browser_evaluate(...)` before dedicated tools.
        - Agents use fixed sleeps instead of targeted waits.
        - Agents confuse same-browser reuse with safe same-tab co-ownership.
        - Agents miss major tool families such as storage, network replay, or session persistence.
    expectations_with_skill:
      - Tool choice starts with deterministic reads and ref-based actions.
      - Shared-browser guidance stays within the current Chrome and Agentyc constraints.
      - Real-world prompts map to the actual 66-tool public surface with examples.
