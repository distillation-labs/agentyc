[package]
name = "agentyc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Host-backed browser task-space automation for coding agents via direct CLI and Node SDK; MCP is compatibility-only."
keywords = ["browser", "automation", "task-space", "cli", "agent"]
categories = ["web-programming", "development-tools", "command-line-utilities"]

[[bin]]
name = "agentyc"
path = "src/main.rs"

[features]
test-support = []

[[bin]]
name = "agentyc-test-host"
path = "src/bin/test-host.rs"
required-features = ["test-support"]

[dependencies]
agentyc-core    = { workspace = true }
agentyc-host    = { workspace = true }
agentyc-mcp     = { workspace = true, features = ["legacy-cdp"] }
agentyc-cdp     = { workspace = true }
agentyc-browser = { workspace = true }
agentyc-runtime = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
mimalloc = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true }
tempfile = { workspace = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
