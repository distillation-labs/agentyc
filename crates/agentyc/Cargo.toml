[package]
name = "agentyc"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agentyc"
path = "src/main.rs"

[dependencies]
agentyc-mcp = { path = "../agentyc-mcp" }
agentyc-cdp = { path = "../agentyc-cdp" }
agentyc-browser = { path = "../agentyc-browser" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
mimalloc = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
