[package]
name = "agentyc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Deterministic, MCP-first browser automation for coding agents. No API key. No LLM. Just CDP, stdio MCP, and 61 tools."
keywords = ["mcp", "browser", "automation", "cdp", "agent"]
categories = ["web-programming", "development-tools", "command-line-utilities"]

[[bin]]
name = "agentyc"
path = "src/main.rs"

[dependencies]
agentyc-mcp     = { workspace = true }
agentyc-cdp     = { workspace = true }
agentyc-browser = { workspace = true }
agentyc-runtime = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
mimalloc = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
rmcp = { workspace = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
